<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Image Toolkit</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .card {
            background: #1e293b;
            border: none;
            border-radius: 15px;
        }

        .btn-custom {
            border-radius: 30px;
            padding: 10px 20px;
        }

        #videoStream {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">🎯 Smart Image Toolkit</h2>

    <!-- CAMERA SECTION -->
    <div class="card p-4 shadow-lg">
        <h4 class="mb-3">🎥 Live Camera</h4>

        <!-- Video Feed -->
        <img id="videoStream" src="/video" alt="Live Camera">

        <!-- Buttons -->
        <div class="mt-4 text-center">
            <button class="btn btn-success btn-custom me-2" onclick="startCamera()">
                ▶ Start Camera
            </button>

            <button class="btn btn-danger btn-custom" onclick="stopCamera()">
                ⏹ Stop Camera
            </button>
        </div>
    </div>

    <!-- IMAGE PROCESSING SECTION -->
    <div class="card p-4 mt-5 shadow-lg">
        <h4 class="mb-3">🖼 Upload & Process Image</h4>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" class="form-control mb-3" required>

            <select name="operation" class="form-select mb-3">
                <option value="blur">Blur</option>
                <option value="threshold">Threshold</option>
                <option value="enhance">Enhance</option>
                <option value="detect">Detect Objects</option>
            </select>

            <button class="btn btn-primary w-100">Process</button>
        </form>

        {% if before %}
        <div class="row mt-4">
            <div class="col-md-4">
                <h6>Before</h6>
                <img src="{{ before }}" class="img-fluid rounded">
            </div>

            <div class="col-md-4">
                <h6>After</h6>
                <img src="{{ after }}" class="img-fluid rounded">
            </div>

            <div class="col-md-4">
                <h6>Histogram</h6>
                <img src="{{ hist }}" class="img-fluid rounded">
            </div>
        </div>
        {% endif %}
    </div>

</div>

<script>
function startCamera() {
    fetch('/start_camera');
    document.getElementById("videoStream").src = "/video?" + new Date().getTime();
}

function stopCamera() {
    fetch('/stop_camera');
    document.getElementById("videoStream").src = "";
}
</script>

</body>
</html>
